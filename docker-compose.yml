version: '3.8'

services:
  # TensorFlow Serving - CPU version
  tensorflow-serving-cpu:
    build:
      context: .
      dockerfile: Dockerfile.cpu
    image: tensorflow-serving:cpu
    container_name: tensorflow-cpu
    ports:
      - "8501:8501"  # REST API
      - "8500:8500"  # gRPC
    environment:
      - MODEL_NAME=tensorflow-model
      - MODEL_PATH=/models/tensorflow-model
      - PORT=8501
      - HOST=0.0.0.0
    volumes:
      - ./models:/models
      - ./logs:/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
    networks:
      - tensorflow-network
    restart: unless-stopped

  # TensorFlow Serving - GPU version
  tensorflow-serving-gpu:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    image: tensorflow-serving:gpu
    container_name: tensorflow-gpu
    ports:
      - "8502:8501"  # REST API (different port to avoid conflict)
      - "8503:8500"  # gRPC (different port)
    environment:
      - MODEL_NAME=tensorflow-model
      - MODEL_PATH=/models/tensorflow-model
      - PORT=8501
      - HOST=0.0.0.0
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - ./models:/models
      - ./logs:/logs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - tensorflow-network
    restart: unless-stopped
    profiles:
      - gpu

  # Prometheus for monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - tensorflow-network
    restart: unless-stopped

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana-dashboards:/etc/grafana/provisioning/dashboards
      - ./config/grafana-datasources:/etc/grafana/provisioning/datasources
    networks:
      - tensorflow-network
    restart: unless-stopped
    depends_on:
      - prometheus

  # Model training service
  tensorflow-training:
    build:
      context: .
      dockerfile: Dockerfile.cpu
    image: tensorflow-training:latest
    container_name: tensorflow-training
    command: ["python3", "/home/appuser/src/train.py"]
    environment:
      - OUTPUT_DIR=/output
      - CHECKPOINT_DIR=/checkpoints
      - LOG_DIR=/logs/training
    volumes:
      - ./src:/home/appuser/src
      - training-output:/output
      - training-checkpoints:/checkpoints
      - ./logs/training:/logs/training
    networks:
      - tensorflow-network
    profiles:
      - training

  # Development environment with Jupyter
  jupyter:
    image: jupyter/tensorflow-notebook:latest
    container_name: jupyter-tensorflow
    ports:
      - "8888:8888"
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - GRANT_SUDO=yes
    volumes:
      - ./notebooks:/home/jovyan/work
      - ./src:/home/jovyan/src
    networks:
      - tensorflow-network
    restart: unless-stopped
    profiles:
      - development

# Named volumes for data persistence
volumes:
  prometheus-data:
  grafana-data:
  training-output:
  training-checkpoints:

# Networks
networks:
  tensorflow-network:
    driver: bridge
    name: tensorflow-network