name: CI - Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run unit tests
      run: |
        python -c "
import sys
sys.path.append('src')
from train import create_model, load_dataset
import tensorflow as tf
import numpy as np

# Test model creation
model = create_model()
assert model is not None
print('✓ Model creation test passed')

# Test dataset loading
(x_train, y_train), (x_test, y_test) = load_dataset()
assert x_train.shape[0] > 0
assert y_train.shape[0] > 0
print('✓ Dataset loading test passed')

# Test serving imports
from serve import load_model
print('✓ All imports successful')
"
        
    - name: Lint with flake8
      run: |
        pip install flake8
        flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 src/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        
    - name: Type checking with mypy
      run: |
        pip install mypy
        mypy src/ --ignore-missing-imports
        
  build:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
      
    - name: Login to DockerHub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
        
    - name: Build CPU image
      run: |
        docker build -t your-org/tensorflow-cpu:latest -f Dockerfile.cpu .
        
    - name: Build GPU image
      run: |
        docker build -t your-org/tensorflow-gpu:latest -f Dockerfile.gpu .
        
    - name: Run container tests
      run: |
        # Test CPU container
        docker run --rm aioperations/tensorflow-cpu:latest python3 -c "import tensorflow as tf; print('TensorFlow version:', tf.__version__)"
        
    - name: Push CPU image
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        # Requires Docker Hub credentials setup
        # docker push your-org/tensorflow-cpu:latest
        echo "Docker push requires configured credentials"
        
    - name: Push GPU image
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        # Requires Docker Hub credentials setup
        # docker push your-org/tensorflow-gpu:latest
        echo "Docker push requires configured credentials"
        
  security:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'docker.io/library/ubuntu:22.04'
        format: 'sarif'
        output: 'trivy-results.sarif'
        
    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-results.sarif'