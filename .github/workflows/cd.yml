name: CD - Release and Deploy

on:
  release:
    types: [published]

jobs:
  release:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0
        
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install setuptools wheel twine
        
    - name: Create Python package
      run: |
        # Create setup.py if it doesn't exist
        if [ ! -f setup.py ]; then
          cat > setup.py << EOF
from setuptools import setup, find_packages

setup(
    name="docker-tensorflow-template",
    version="${{ github.event.release.tag_name }}",
    description="Production-ready Docker template for TensorFlow deployments",
    long_description=open("README.md").read(),
    long_description_content_type="text/markdown",
    author="AI Operations",
    author_email="support@aioperations.io",
    url="https://github.com/aioperations-io/docker-tensorflow",
    packages=find_packages(),
    classifiers=[
        "Development Status :: 4 - Beta",
        "Intended Audience :: Developers",
        "Topic :: Software Development :: Build Tools",
        "License :: OSI Approved :: MIT License",
        "Programming Language :: Python :: 3",
        "Programming Language :: Python :: 3.10",
    ],
    python_requires=">=3.10",
)
EOF
        fi
        
        python setup.py sdist bdist_wheel
        
    - name: Publish to PyPI
      env:
        TWINE_USERNAME: ${{ secrets.PYPI_USERNAME }}
        TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
      run: |
        twine upload dist/*
        
  docker-release:
    runs-on: ubuntu-latest
    needs: release
    
    steps:
    - uses: actions/checkout@v3
        
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
      
    - name: Login to DockerHub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
        
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v4
      with:
        images: your-org/tensorflow
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=ref,event=branch
          type=ref,event=pr
          type=sha
        
    - name: Build and push CPU image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./Dockerfile.cpu
        push: true
        tags: ${{ steps.meta.outputs.tags }}-cpu
        labels: ${{ steps.meta.outputs.labels }}
        
    - name: Build and push GPU image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./Dockerfile.gpu
        push: true
        tags: ${{ steps.meta.outputs.tags }}-gpu
        labels: ${{ steps.meta.outputs.labels }}
        
  deploy-docs:
    runs-on: ubuntu-latest
    needs: docker-release
    
    steps:
    - uses: actions/checkout@v3
        
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./docs
        destination_dir: ./docs
        keep_files: true
        
  notify:
    runs-on: ubuntu-latest
    needs: [release, docker-release, deploy-docs]
    
    steps:
    - name: Send Discord notification
      uses: appleboy/discord-action@master
      with:
        webhook_id: ${{ secrets.DISCORD_WEBHOOK_ID }}
        webhook_token: ${{ secrets.DISCORD_WEBHOOK_TOKEN }}
        color: "#00ff00"
        username: "AI Operations CI/CD"
        message: |
          🚀 New release published: ${{ github.event.release.tag_name }}
          
          **Template:** Docker for TensorFlow
          **Version:** ${{ github.event.release.tag_name }}
          **Release Notes:** ${{ github.event.release.body }}
          
          **Downloads:**
          - Docker Hub: `docker pull your-org/tensorflow:${{ github.event.release.tag_name }}-cpu`
          - Docker Hub: `docker pull your-org/tensorflow:${{ github.event.release.tag_name }}-gpu`
          - PyPI: `pip install docker-tensorflow-template==${{ github.event.release.tag_name }}`
          
          **Documentation:** https://your-org.github.io/docker-tensorflow/
          
          View release: ${{ github.event.release.html_url }}